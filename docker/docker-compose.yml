# Kern der Absicherung: der Downloader hängt AUSSCHLIESSLICH in einem
# internen Netz ohne Route ins Internet. Der einzige Weg nach draußen
# führt über den Tor-Container. Selbst eine falsche Einstellung kann
# damit keine Verbindung an Tor vorbei aufbauen – es gibt keine.
services:
  tor:
    build:
      context: ..
      dockerfile: docker/tor/Dockerfile
    image: secure-downloader-tor:3.3
    container_name: downloader-tor
    restart: unless-stopped
    networks: [tornet, outnet]     # Brücke: internes Netz <-> Internet
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "curl -s --socks5-hostname 127.0.0.1:9050 -o /dev/null -m 25 https://check.torproject.org/ || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  downloader:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: secure-downloader:3.3
    container_name: downloader
    restart: unless-stopped
    depends_on:
      tor:
        condition: service_healthy
    networks: [tornet]             # NUR internes Netz – kein Direktzugang
    ports:
      # Auf die LAN-Adresse der NAS ändern, z. B. "192.168.1.50:8080:8080".
      # Niemals im Router nach außen weiterleiten.
      - "127.0.0.1:8080:8080"
    volumes:
      - /volume1/daten/archiv:/data
    environment:
      - PUID=1000                       # id -u deines NAS-Benutzers
      - PGID=1000                       # id -g deines NAS-Benutzers
      - TZ=Europe/Berlin
      - UI_PASSWORD=                    # leer = Zufallswort im Container-Log
      - AUTOSTART=0                     # 1 = nach Neustart sofort weiterladen
      - ENFORCE_ANON=1                  # Schutz im Browser nicht abschaltbar
      - PIN_SOCKS_PROXY=socks5h://tor:9050
      - PIN_REQUIRE_HTTPS=1             # 0 nur, wenn dein Ziel .onion ist
      # TLS: erzeugt beim ersten Start ein eigenes Zertifikat und schreibt
      # den Fingerabdruck ins Protokoll. Für ein echtes Zertifikat die
      # beiden Pfade setzen oder den Reverse-Proxy der NAS davorstellen.
      - UI_TLS_AUTO=1
      # - UI_TLS_HOST=192.168.1.50     # kommt in den Zertifikatsnamen
      # - UI_TLS_CERT=/data/config/ui.crt
      # - UI_TLS_KEY=/data/config/ui.key
      # Eigene Inhaltsprüfung vor der Übernahme (z. B. Virenscanner).
      # Absichtlich NICHT in der Oberfläche einstellbar – ein Eingabefeld
      # für ein auszuführendes Programm wäre eine Fernausführungslücke.
      # - SCAN_CMD=/data/config/scan.sh
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true          # Nur /data und /tmp sind beschreibbar
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m

# Beispiel für einen Virenscanner als Beiwagen. Die Signaturen (~1 GB)
# gehören nicht ins Downloader-Image.
#  clamav:
#    image: clamav/clamav:stable
#    container_name: downloader-clamav
#    restart: unless-stopped
#    networks: [tornet]
#    volumes:
#      - /volume1/daten/archiv:/data:ro
#    # /data/config/scan.sh ruft dann clamdscan im Beiwagen auf.

networks:
  tornet:
    internal: true      # <- kein Weg ins Internet
  outnet:
    driver: bridge
