services:
  tor:
    image: dperson/torproxy:latest
    container_name: downloader-tor
    restart: unless-stopped
    networks: [dlnet]
    # Der SOCKS-Port bleibt im internen Netz – nichts wird zum Host geöffnet.
    healthcheck:
      test: ["CMD-SHELL", "curl -s --socks5-hostname 127.0.0.1:9050 -o /dev/null -m 20 https://check.torproject.org/ || exit 1"]
      interval: 60s
      timeout: 25s
      retries: 3
      start_period: 40s

  downloader:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: secure-downloader:3.3
    container_name: downloader
    restart: unless-stopped
    depends_on: [tor]
    networks: [dlnet]
    ports:
      # WICHTIG: an die LAN-Adresse deiner NAS binden, nicht an 0.0.0.0,
      # und niemals im Router nach außen weiterleiten.
      - "127.0.0.1:8080:8080"
    volumes:
      - /volume1/daten/archiv:/data
    environment:
      - PUID=1000                 # id -u deines NAS-Benutzers
      - PGID=1000                 # id -g deines NAS-Benutzers
      - TZ=Europe/Berlin
      - UI_PASSWORD=              # leer = Zufallswort, steht im Container-Log
      - AUTOSTART=0               # 1 = nach Neustart sofort weiterladen
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777

networks:
  dlnet:
    driver: bridge
